name: Import JPEG collection images

on:
  push:
    paths:
      - ".github/workflows/import-jpeg-collection.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JPEG originals
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL "https://at.adobe.com/xXbpKEQQqmP1cKgC" -o assets/new-gold-couple-v5.jpg
          curl -fL "https://at.adobe.com/Ko0jW3eRtB0OlgZR" -o assets/new-bridal-gold-v5.jpg
          curl -fL "https://at.adobe.com/tVdwmOslBkJ1WFpM" -o assets/new-gold-drape-v5.jpg
          curl -fL "https://at.adobe.com/4Ngn4rXHpksdZVwv" -o assets/new-orange-burgundy-v5.jpg

      - name: Commit JPEG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/new-*-v5.jpg
          git commit -m "Add JPEG fallbacks for new collection"
          git push
