name: Import new Habesharon collection images

on:
  push:
    paths:
      - ".github/workflows/import-new-collection.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download and optimize new collection images
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/habesharon-new

          curl -fL "https://at.adobe.com/xXbpKEQQqmP1cKgC" -o /tmp/habesharon-new/couple.jpg
          curl -fL "https://at.adobe.com/Ko0jW3eRtB0OlgZR" -o /tmp/habesharon-new/bridal.jpg
          curl -fL "https://at.adobe.com/tVdwmOslBkJ1WFpM" -o /tmp/habesharon-new/gold.jpg
          curl -fL "https://at.adobe.com/4Ngn4rXHpksdZVwv" -o /tmp/habesharon-new/orange.jpg

          cwebp -quiet -q 84 -resize 900 0 /tmp/habesharon-new/couple.jpg -o assets/new-gold-couple-v4.webp
          cwebp -quiet -q 84 -resize 900 0 /tmp/habesharon-new/bridal.jpg -o assets/new-bridal-gold-v4.webp
          cwebp -quiet -q 84 -resize 900 0 /tmp/habesharon-new/gold.jpg -o assets/new-gold-drape-v4.webp
          cwebp -quiet -q 84 -resize 900 0 /tmp/habesharon-new/orange.jpg -o assets/new-orange-burgundy-v4.webp

      - name: Commit new assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/new-*-v4.webp
          git commit -m "Add new Habesharon collection images"
          git push
