name: Import Habesharon editorial assets

on:
  push:
    paths:
      - ".github/workflows/import-editorial-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download and optimize editorial images
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/habesharon

          curl -fL "https://at.adobe.com/ZF21bGFtCaHnc34j" -o /tmp/habesharon/heritage.png
          curl -fL "https://at.adobe.com/vPlwOfQwGMljAO6X" -o /tmp/habesharon/together.png
          curl -fL "https://at.adobe.com/PmnvL8est4lTuK1v" -o /tmp/habesharon/sunlit.png
          curl -fL "https://at.adobe.com/8h5PMB9Tic4YL2fp" -o /tmp/habesharon/celebration.png
          curl -fL "https://at.adobe.com/WTfnyFKJ8hB6gsBm" -o /tmp/habesharon/sisterhood.png

          cwebp -quiet -q 82 -resize 900 0 /tmp/habesharon/heritage.png -o assets/heritage-purple.webp
          cwebp -quiet -q 82 -resize 900 0 /tmp/habesharon/together.png -o assets/together-always.webp
          cwebp -quiet -q 82 -resize 900 0 /tmp/habesharon/sunlit.png -o assets/sunlit-yellow.webp
          cwebp -quiet -q 82 -resize 1200 0 /tmp/habesharon/celebration.png -o assets/celebration-turquoise.webp
          cwebp -quiet -q 82 -resize 1400 0 /tmp/habesharon/sisterhood.png -o assets/sisterhood-group.webp

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heritage-purple.webp assets/together-always.webp assets/sunlit-yellow.webp assets/celebration-turquoise.webp assets/sisterhood-group.webp
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Replace editorial collection images with optimized originals"
          git push
